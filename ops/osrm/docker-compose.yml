services:
  osrm:
    image: osrm/osrm-backend:v5.27.0
    restart: unless-stopped
    ports:
      - "${OSRM_HOST_PORT:-5000}:5000"
    volumes:
      - ./data:/data:ro
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/brazil-latest.osrm
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:5000/route/v1/driving/-51.407,-22.121;-51.406,-22.122?overview=false",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
