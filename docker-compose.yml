services:
  mysql:
    image: mysql:8.4
    container_name: routing-pwa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: routing_pwa
      MYSQL_USER: routing_user
      MYSQL_PASSWORD: routing_local_pass
      MYSQL_ROOT_PASSWORD: routing_root_pass
    ports:
      - "3307:3306"
    volumes:
      - routing_pwa_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -urouting_user -prouting_local_pass --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  routing_pwa_mysql_data:
