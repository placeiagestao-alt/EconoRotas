services:
  osrm-brazil:
    image: osrm/osrm-backend:latest
    container_name: ${OSRM_CONTAINER_NAME:-econorota-osrm-brazil}
    restart: unless-stopped
    ports:
      - "${OSRM_BIND_ADDRESS:-127.0.0.1}:${OSRM_HOST_PORT:-5000}:5000"
    volumes:
      - ./data:/data:ro
    command: osrm-routed --algorithm mld /data/${OSRM_DATASET:-brazil-latest}.osrm
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /route/v1/driving/-51.407,-22.121;-51.406,-22.122?overview=false HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"code\":\"Ok\"' <&3",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
